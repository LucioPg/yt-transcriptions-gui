[project]
name = "yt-transcriptor"
version = "0.1.0"
description = "Extract YouTube video transcripts directly without downloading videos"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
    "youtube-transcript-api>=1.2.3",
]

[project.scripts]
yt-transcriptor-cli = "src.cli_main:main"
yt-transcriptor-web = "src.web_main:main"

[project.optional-dependencies]
dev = [
    "coverage>=7.12.0",
    "pytest>=9.0.1",
    "httpx>=0.28.1",
    "pytest-mock>=3.15.1",
]
packaging = [
    "pyinstaller>=6.0.0",
    "windows-curses>=2.3.1; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "cairosvg>=2.8.2",
]
