<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with YouTube-like gradient -->
  <defs>
    <linearGradient id="youtubeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34A853;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#youtubeRed)" stroke="#CC0000" stroke-width="8"/>

  <!-- YouTube play button stylized -->
  <rect x="160" y="140" width="192" height="120" rx="12" fill="#FFFFFF" opacity="0.95"/>
  <polygon points="210,180 210,220 250,200" fill="#FF0000"/>

  <!-- Transcription lines below the play button -->
  <rect x="140" y="290" width="232" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
  <rect x="160" y="310" width="192" height="6" rx="3" fill="#FFFFFF" opacity="0.8"/>
  <rect x="180" y="325" width="152" height="6" rx="3" fill="#FFFFFF" opacity="0.7"/>
  <rect x="200" y="340" width="112" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>

  <!-- Small "T" letter badge to indicate "Transcriptor" -->
  <circle cx="420" cy="100" r="40" fill="url(#textGradient)" stroke="#FFFFFF" stroke-width="4"/>
  <text x="420" y="115" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#FFFFFF">T</text>
</svg>